name: Terraform Apply & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'src/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -var-file=environments/${{ github.event.inputs.environment || 'dev' }}/terraform.tfvars \
            -auto-approve

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: terraform
        run: |
          echo "bucket_name=$(terraform output -raw website_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "log_group=$(terraform output -raw cloudwatch_log_group_name)" >> $GITHUB_OUTPUT

      - name: Log to CloudWatch
        run: |
          aws logs put-log-events \
            --log-group-name ${{ steps.terraform-outputs.outputs.log_group }} \
            --log-stream-name deployment \
            --log-events timestamp=$(date +%s)000,message="Terraform applied successfully for ${{ github.event.inputs.environment || 'dev' }}"

    outputs:
      bucket_name: ${{ steps.terraform-outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.terraform-outputs.outputs.distribution_id }}
      log_group: ${{ steps.terraform-outputs.outputs.log_group }}

  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create placeholder website if not exists
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PaulKiat.io - Coming Soon</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                  }
                  .container {
                      text-align: center;
                      padding: 2rem;
                  }
                  h1 {
                      font-size: 3rem;
                      margin-bottom: 1rem;
                  }
                  p {
                      font-size: 1.5rem;
                      opacity: 0.9;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>PaulKiat.io</h1>
                  <p>Coming Soon</p>
                  <p style="font-size: 1rem; margin-top: 2rem;">Infrastructure is ready. Stay tuned!</p>
              </div>
          </body>
          </html>
          EOF
          fi
          
          if [ ! -f dist/error.html ]; then
            cat > dist/error.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Error - PaulKiat.io</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                      background: #f5f5f5;
                      color: #333;
                  }
                  .container {
                      text-align: center;
                      padding: 2rem;
                  }
                  h1 {
                      font-size: 4rem;
                      margin-bottom: 1rem;
                      color: #667eea;
                  }
                  p {
                      font-size: 1.2rem;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>404</h1>
                  <p>Page not found</p>
                  <a href="/" style="color: #667eea;">Go back home</a>
              </div>
          </body>
          </html>
          EOF
          fi

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform-apply.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs.distribution_id }} \
            --paths "/*"

      - name: Log deployment to CloudWatch
        run: |
          aws logs put-log-events \
            --log-group-name ${{ needs.terraform-apply.outputs.log_group }} \
            --log-stream-name deployment \
            --log-events timestamp=$(date +%s)000,message="Website deployed successfully to ${{ github.event.inputs.environment || 'dev' }}"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ needs.terraform-apply.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ needs.terraform-apply.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudWatch Log Group**: ${{ needs.terraform-apply.outputs.log_group }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
